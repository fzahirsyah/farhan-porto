<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="notakris-preview" viewBox="0 0 1200 770" width="1200" height="770" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="notakris-preview-title notakris-preview-desc">
    <title id="notakris-preview-title">NotaKris illustrative product preview</title><desc id="notakris-preview-desc">Authored miniature UI for portfolio motion; not an exact screenshot. All displayed records and counts are synthetic. Office application and client portal foundation.</desc>
    <defs>
    <linearGradient id="notakris-preview-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087BFF"/><stop offset="1" stop-color="#41D5E8"/></linearGradient>
    <linearGradient id="notakris-preview-glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset="1" stop-color="#EDF6FF" stop-opacity=".92"/></linearGradient>
    <linearGradient id="notakris-preview-silk" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#E9F7FF" stop-opacity=".12"/><stop offset=".4" stop-color="#A9DAFF" stop-opacity=".48"/><stop offset=".48" stop-color="#FFF"/><stop offset=".55" stop-color="#4EA6F4" stop-opacity=".65"/><stop offset=".72" stop-color="#D2F3FF" stop-opacity=".65"/><stop offset="1" stop-color="#F4FBFF" stop-opacity="0"/></linearGradient>
    <radialGradient id="notakris-preview-halo"><stop stop-color="#BCE9FF" stop-opacity=".7"/><stop offset="1" stop-color="#DFF3FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="notakris-preview-orb" cx=".3" cy=".2"><stop stop-color="#FFF"/><stop offset=".25" stop-color="#B8EDFF"/><stop offset=".6" stop-color="#53B9F2"/><stop offset="1" stop-color="#0B72CF"/></radialGradient>
    <filter id="notakris-preview-shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#477EAE" flood-opacity=".10"/></filter>
    <marker id="notakris-preview-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#65ACEE" stroke-width="1.3"/></marker>
    </defs><style>
    #notakris-preview {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    #notakris-preview .float {animation:notakris-preview-float 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #notakris-preview .float-alt {animation:notakris-preview-float 12s ease-in-out -4s infinite reverse;transform-box:fill-box;transform-origin:center}
    #notakris-preview .pulse {animation:notakris-preview-pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #notakris-preview .flow {stroke-dasharray:6 11;animation:notakris-preview-flow 3s linear infinite}
    #notakris-preview .spin {animation:notakris-preview-spin 22s linear infinite;transform-box:fill-box;transform-origin:center}
    #notakris-preview .scan {animation:notakris-preview-scan 7s ease-in-out infinite}
    #notakris-preview .bar {animation:notakris-preview-bar 6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
    #notakris-preview .draw {stroke-dasharray:2200;stroke-dashoffset:0;animation:notakris-preview-draw 12s ease-in-out infinite}
    @keyframes notakris-preview-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes notakris-preview-pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes notakris-preview-flow{to{stroke-dashoffset:-68}}
    @keyframes notakris-preview-spin{to{transform:rotate(360deg)}}
    @keyframes notakris-preview-scan{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(235px);opacity:.9}}
    @keyframes notakris-preview-bar{0%,100%{transform:scaleY(.92)}50%{transform:scaleY(1)}}
    @keyframes notakris-preview-draw{0%,100%{stroke-dashoffset:100}50%{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){#notakris-preview *,#notakris-preview *::before,#notakris-preview *::after{animation:none!important;transition:none!important}}
