<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="soft-halo" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="soft-halo-title soft-halo-desc">
    <title id="soft-halo-title">Soft blue ambient halo</title><desc id="soft-halo-desc">Soft blue ambient halo</desc>
    <defs>
    <linearGradient id="soft-halo-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087BFF"/><stop offset="1" stop-color="#41D5E8"/></linearGradient>
    <linearGradient id="soft-halo-glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset="1" stop-color="#EDF6FF" stop-opacity=".92"/></linearGradient>
    <linearGradient id="soft-halo-silk" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#E9F7FF" stop-opacity=".12"/><stop offset=".4" stop-color="#A9DAFF" stop-opacity=".48"/><stop offset=".48" stop-color="#FFF"/><stop offset=".55" stop-color="#4EA6F4" stop-opacity=".65"/><stop offset=".72" stop-color="#D2F3FF" stop-opacity=".65"/><stop offset="1" stop-color="#F4FBFF" stop-opacity="0"/></linearGradient>
    <radialGradient id="soft-halo-halo"><stop stop-color="#BCE9FF" stop-opacity=".7"/><stop offset="1" stop-color="#DFF3FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="soft-halo-orb" cx=".3" cy=".2"><stop stop-color="#FFF"/><stop offset=".25" stop-color="#B8EDFF"/><stop offset=".6" stop-color="#53B9F2"/><stop offset="1" stop-color="#0B72CF"/></radialGradient>
    <filter id="soft-halo-shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#477EAE" flood-opacity=".10"/></filter>
    <marker id="soft-halo-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#65ACEE" stroke-width="1.3"/></marker>
    </defs><style>
    #soft-halo {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    #soft-halo .float {animation:soft-halo-float 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #soft-halo .float-alt {animation:soft-halo-float 12s ease-in-out -4s infinite reverse;transform-box:fill-box;transform-origin:center}
    #soft-halo .pulse {animation:soft-halo-pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #soft-halo .flow {stroke-dasharray:6 11;animation:soft-halo-flow 3s linear infinite}
    #soft-halo .spin {animation:soft-halo-spin 22s linear infinite;transform-box:fill-box;transform-origin:center}
    #soft-halo .scan {animation:soft-halo-scan 7s ease-in-out infinite}
    #soft-halo .bar {animation:soft-halo-bar 6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
    #soft-halo .draw {stroke-dasharray:2200;stroke-dashoffset:0;animation:soft-halo-draw 12s ease-in-out infinite}
    @keyframes soft-halo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes soft-halo-pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes soft-halo-flow{to{stroke-dashoffset:-68}}
    @keyframes soft-halo-spin{to{transform:rotate(360deg)}}
    @keyframes soft-halo-scan{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(235px);opacity:.9}}
    @keyframes soft-halo-bar{0%,100%{transform:scaleY(.92)}50%{transform:scaleY(1)}}
    @keyframes soft-halo-draw{0%,100%{stroke-dashoffset:100}50%{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){#soft-halo *,#soft-halo *::before,#soft-halo *::after{animation:none!important;transition:none!important}}
    </style><ellipse cx="600" cy="400" rx="560" ry="390" fill="url(#soft-halo-halo)"/></svg>