<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="silk-finale" viewBox="0 0 1440 900" width="1440" height="900" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="silk-finale-title silk-finale-desc">
    <title id="silk-finale-title">Silk Finale</title><desc id="silk-finale-desc">Transparent layered silver, cyan and blue ribbons. Five independently addressable layers; suitable behind HTML content.</desc>
    <defs>
    <linearGradient id="silk-finale-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087BFF"/><stop offset="1" stop-color="#41D5E8"/></linearGradient>
    <linearGradient id="silk-finale-glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset="1" stop-color="#EDF6FF" stop-opacity=".92"/></linearGradient>
    <linearGradient id="silk-finale-silk" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#E9F7FF" stop-opacity=".12"/><stop offset=".4" stop-color="#A9DAFF" stop-opacity=".48"/><stop offset=".48" stop-color="#FFF"/><stop offset=".55" stop-color="#4EA6F4" stop-opacity=".65"/><stop offset=".72" stop-color="#D2F3FF" stop-opacity=".65"/><stop offset="1" stop-color="#F4FBFF" stop-opacity="0"/></linearGradient>
    <radialGradient id="silk-finale-halo"><stop stop-color="#BCE9FF" stop-opacity=".7"/><stop offset="1" stop-color="#DFF3FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="silk-finale-orb" cx=".3" cy=".2"><stop stop-color="#FFF"/><stop offset=".25" stop-color="#B8EDFF"/><stop offset=".6" stop-color="#53B9F2"/><stop offset="1" stop-color="#0B72CF"/></radialGradient>
    <filter id="silk-finale-shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#477EAE" flood-opacity=".10"/></filter>
    <marker id="silk-finale-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#65ACEE" stroke-width="1.3"/></marker>
    </defs><style>
    #silk-finale {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    #silk-finale .float {animation:silk-finale-float 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #silk-finale .float-alt {animation:silk-finale-float 12s ease-in-out -4s infinite reverse;transform-box:fill-box;transform-origin:center}
    #silk-finale .pulse {animation:silk-finale-pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #silk-finale .flow {stroke-dasharray:6 11;animation:silk-finale-flow 3s linear infinite}
    #silk-finale .spin {animation:silk-finale-spin 22s linear infinite;transform-box:fill-box;transform-origin:center}
    #silk-finale .scan {animation:silk-finale-scan 7s ease-in-out infinite}
    #silk-finale .bar {animation:silk-finale-bar 6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
    #silk-finale .draw {stroke-dasharray:2200;stroke-dashoffset:0;animation:silk-finale-draw 12s ease-in-out infinite}
    @keyframes silk-finale-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes silk-finale-pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes silk-finale-flow{to{stroke-dashoffset:-68}}
    @keyframes silk-finale-spin{to{transform:rotate(360deg)}}
    @keyframes silk-finale-scan{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(235px);opacity:.9}}
    @keyframes silk-finale-bar{0%,100%{transform:scaleY(.92)}50%{transform:scaleY(1)}}
    @keyframes silk-finale-draw{0%,100%{stroke-dashoffset:100}50%{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){#silk-finale *,#silk-finale *::before,#silk-finale *::after{animation:none!important;transition:none!important}}
    </style><ellipse cx="1010" cy="500" rx="520" ry="310" fill="url(#silk-finale-halo)"/><g id="silk-finale-ribbon-1" data-part="ribbon" class="float-alt" opacity="0.3"><path d="M-100 415C180 155,270 685,575 455S1000 275,1540 470L1540 605C1120 405,915 505,640 555S100 385,-100 605Z" fill="url(#silk-finale-silk)"/><path d="M-100 415C180 155,270 685,575 455S1000 275,1540 470" fill="none" stroke="#FFFFFF" stroke-width="1.3"/></g><g id="silk-finale-ribbon-2" data-part="ribbon" class="float" opacity="0.4"><path d="M-100 434C180 174,270 704,575 474S1000 294,1540 489L1540 624C1120 424,915 524,640 574S100 404,-100 624Z" fill="url(#silk-finale-silk)"/><path d="M-100 434C180 174,270 704,575 474S1000 294,1540 489" fill="none" stroke="#FFFFFF" stroke-width="1.3"/></g><g id="silk-finale-ribbon-3" data-part="ribbon" class="float-alt" opacity="0.5"><path d="M-100 453C180 193,270 723,575 493S1000 313,1540 508L1540 643C1120 443,915 543,640 593S100 423,-100 643Z" fill="url(#silk-finale-silk)"/><path d="M-100 453C180 193,270 723,575 493S1000 313,1540 508" fill="none" stroke="#FFFFFF" stroke-width="1.3"/></g><g id="silk-finale-ribbon-4" data-part="ribbon" class="float" opacity="0.6000000000000001"><path d="M-100 472C180 212,270 742,575 512S1000 332,1540 527L1540 662C1120 462,915 562,640 612S100 442,-100 662Z" fill="url(#silk-finale-silk)"/><path d="M-100 472C180 212,270 742,575 512S1000 332,1540 527" fill="none" stroke="#FFFFFF" stroke-width="1.3"/></g><g id="silk-finale-ribbon-5" data-part="ribbon" class="float-alt" opacity="0.7"><path d="M-100 491C180 231,270 761,575 531S1000 351,1540 546L1540 681C1120 481,915 581,640 631S100 461,-100 681Z" fill="url(#silk-finale-silk)"/><path d="M-100 491C180 231,270 761,575 531S1000 351,1540 546" fill="none" stroke="#FFFFFF" stroke-width="1.3"/></g></svg>