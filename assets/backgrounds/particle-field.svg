<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="particle-field" viewBox="0 0 1440 900" width="1440" height="900" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="particle-field-title particle-field-desc">
    <title id="particle-field-title">Sparse particle field</title><desc id="particle-field-desc">Sparse particle field</desc>
    <defs>
    <linearGradient id="particle-field-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087BFF"/><stop offset="1" stop-color="#41D5E8"/></linearGradient>
    <linearGradient id="particle-field-glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset="1" stop-color="#EDF6FF" stop-opacity=".92"/></linearGradient>
    <linearGradient id="particle-field-silk" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#E9F7FF" stop-opacity=".12"/><stop offset=".4" stop-color="#A9DAFF" stop-opacity=".48"/><stop offset=".48" stop-color="#FFF"/><stop offset=".55" stop-color="#4EA6F4" stop-opacity=".65"/><stop offset=".72" stop-color="#D2F3FF" stop-opacity=".65"/><stop offset="1" stop-color="#F4FBFF" stop-opacity="0"/></linearGradient>
    <radialGradient id="particle-field-halo"><stop stop-color="#BCE9FF" stop-opacity=".7"/><stop offset="1" stop-color="#DFF3FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="particle-field-orb" cx=".3" cy=".2"><stop stop-color="#FFF"/><stop offset=".25" stop-color="#B8EDFF"/><stop offset=".6" stop-color="#53B9F2"/><stop offset="1" stop-color="#0B72CF"/></radialGradient>
    <filter id="particle-field-shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#477EAE" flood-opacity=".10"/></filter>
    <marker id="particle-field-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#65ACEE" stroke-width="1.3"/></marker>
    </defs><style>
    #particle-field {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    #particle-field .float {animation:particle-field-float 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #particle-field .float-alt {animation:particle-field-float 12s ease-in-out -4s infinite reverse;transform-box:fill-box;transform-origin:center}
    #particle-field .pulse {animation:particle-field-pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #particle-field .flow {stroke-dasharray:6 11;animation:particle-field-flow 3s linear infinite}
    #particle-field .spin {animation:particle-field-spin 22s linear infinite;transform-box:fill-box;transform-origin:center}
    #particle-field .scan {animation:particle-field-scan 7s ease-in-out infinite}
    #particle-field .bar {animation:particle-field-bar 6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
    #particle-field .draw {stroke-dasharray:2200;stroke-dashoffset:0;animation:particle-field-draw 12s ease-in-out infinite}
    @keyframes particle-field-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes particle-field-pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes particle-field-flow{to{stroke-dashoffset:-68}}
    @keyframes particle-field-spin{to{transform:rotate(360deg)}}
    @keyframes particle-field-scan{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(235px);opacity:.9}}
    @keyframes particle-field-bar{0%,100%{transform:scaleY(.92)}50%{transform:scaleY(1)}}
    @keyframes particle-field-draw{0%,100%{stroke-dashoffset:100}50%{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){#particle-field *,#particle-field *::before,#particle-field *::after{animation:none!important;transition:none!important}}
