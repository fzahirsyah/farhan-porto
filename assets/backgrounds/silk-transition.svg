<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="silk-transition" viewBox="0 0 1440 900" width="1440" height="900" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="silk-transition-title silk-transition-desc">
    <title id="silk-transition-title">Silk Transition</title><desc id="silk-transition-desc">Transparent layered silver, cyan and blue ribbons. Five independently addressable layers; suitable behind HTML content.</desc>
    <defs>
    <linearGradient id="silk-transition-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087BFF"/><stop offset="1" stop-color="#41D5E8"/></linearGradient>
    <linearGradient id="silk-transition-glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset="1" stop-color="#EDF6FF" stop-opacity=".92"/></linearGradient>
    <linearGradient id="silk-transition-silk" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#E9F7FF" stop-opacity=".12"/><stop offset=".4" stop-color="#A9DAFF" stop-opacity=".48"/><stop offset=".48" stop-color="#FFF"/><stop offset=".55" stop-color="#4EA6F4" stop-opacity=".65"/><stop offset=".72" stop-color="#D2F3FF" stop-opacity=".65"/><stop offset="1" stop-color="#F4FBFF" stop-opacity="0"/></linearGradient>
    <radialGradient id="silk-transition-halo"><stop stop-color="#BCE9FF" stop-opacity=".7"/><stop offset="1" stop-color="#DFF3FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="silk-transition-orb" cx=".3" cy=".2"><stop stop-color="#FFF"/><stop offset=".25" stop-color="#B8EDFF"/><stop offset=".6" stop-color="#53B9F2"/><stop offset="1" stop-color="#0B72CF"/></radialGradient>
    <filter id="silk-transition-shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#477EAE" flood-opacity=".10"/></filter>
    <marker id="silk-transition-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#65ACEE" stroke-width="1.3"/></marker>
    </defs><style>
    #silk-transition {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    #silk-transition .float {animation:silk-transition-float 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #silk-transition .float-alt {animation:silk-transition-float 12s ease-in-out -4s infinite reverse;transform-box:fill-box;transform-origin:center}
    #silk-transition .pulse {animation:silk-transition-pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #silk-transition .flow {stroke-dasharray:6 11;animation:silk-transition-flow 3s linear infinite}
    #silk-transition .spin {animation:silk-transition-spin 22s linear infinite;transform-box:fill-box;transform-origin:center}
    #silk-transition .scan {animation:silk-transition-scan 7s ease-in-out infinite}
    #silk-transition .bar {animation:silk-transition-bar 6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
    #silk-transition .draw {stroke-dasharray:2200;stroke-dashoffset:0;animation:silk-transition-draw 12s ease-in-out infinite}
    @keyframes silk-transition-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes silk-transition-pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes silk-transition-flow{to{stroke-dashoffset:-68}}
    @keyframes silk-transition-spin{to{transform:rotate(360deg)}}
    @keyframes silk-transition-scan{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(235px);opacity:.9}}
    @keyframes silk-transition-bar{0%,100%{transform:scaleY(.92)}50%{transform:scaleY(1)}}
    @keyframes silk-transition-draw{0%,100%{stroke-dashoffset:100}50%{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){#silk-transition *,#silk-transition *::before,#silk-transition *::after{animation:none!important;transition:none!important}}
    </style><ellipse cx="1010" cy="500" rx="520" ry="310" fill="url(#silk-transition-halo)"/><g id="silk-transition-ribbon-1" data-part="ribbon" class="float-alt" opacity="0.3"><path d="M-100 345C180 85,270 615,575 385S1000 205,1540 400L1540 535C1120 335,915 435,640 485S100 315,-100 535Z" fill="url(#silk-transition-silk)"/><path d="M-100 345C180 85,270 615,575 385S1000 205,1540 400" fill="none" stroke="#FFFFFF" stroke-width="1.3"/></g><g id="silk-transition-ribbon-2" data-part="ribbon" class="float" opacity="0.4"><path d="M-100 364C180 104,270 634,575 404S1000 224,1540 419L1540 554C1120 354,915 454,640 504S100 334,-100 554Z" fill="url(#silk-transition-silk)"/><path d="M-100 364C180 104,270 634,575 404S1000 224,1540 419" fill="none" stroke="#FFFFFF" stroke-width="1.3"/></g><g id="silk-transition-ribbon-3" data-part="ribbon" class="float-alt" opacity="0.5"><path d="M-100 383C180 123,270 653,575 423S1000 243,1540 438L1540 573C1120 373,915 473,640 523S100 353,-100 573Z" fill="url(#silk-transition-silk)"/><path d="M-100 383C180 123,270 653,575 423S1000 243,1540 438" fill="none" stroke="#FFFFFF" stroke-width="1.3"/></g><g id="silk-transition-ribbon-4" data-part="ribbon" class="float" opacity="0.6000000000000001"><path d="M-100 402C180 142,270 672,575 442S1000 262,1540 457L1540 592C1120 392,915 492,640 542S100 372,-100 592Z" fill="url(#silk-transition-silk)"/><path d="M-100 402C180 142,270 672,575 442S1000 262,1540 457" fill="none" stroke="#FFFFFF" stroke-width="1.3"/></g><g id="silk-transition-ribbon-5" data-part="ribbon" class="float-alt" opacity="0.7"><path d="M-100 421C180 161,270 691,575 461S1000 281,1540 476L1540 611C1120 411,915 511,640 561S100 391,-100 611Z" fill="url(#silk-transition-silk)"/><path d="M-100 421C180 161,270 691,575 461S1000 281,1540 476" fill="none" stroke="#FFFFFF" stroke-width="1.3"/></g></svg>