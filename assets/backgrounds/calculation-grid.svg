<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="calculation-grid" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="calculation-grid-title calculation-grid-desc">
    <title id="calculation-grid-title">Subtle calculation grid</title><desc id="calculation-grid-desc">Subtle calculation grid</desc>
    <defs>
    <linearGradient id="calculation-grid-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087BFF"/><stop offset="1" stop-color="#41D5E8"/></linearGradient>
    <linearGradient id="calculation-grid-glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset="1" stop-color="#EDF6FF" stop-opacity=".92"/></linearGradient>
    <linearGradient id="calculation-grid-silk" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#E9F7FF" stop-opacity=".12"/><stop offset=".4" stop-color="#A9DAFF" stop-opacity=".48"/><stop offset=".48" stop-color="#FFF"/><stop offset=".55" stop-color="#4EA6F4" stop-opacity=".65"/><stop offset=".72" stop-color="#D2F3FF" stop-opacity=".65"/><stop offset="1" stop-color="#F4FBFF" stop-opacity="0"/></linearGradient>
    <radialGradient id="calculation-grid-halo"><stop stop-color="#BCE9FF" stop-opacity=".7"/><stop offset="1" stop-color="#DFF3FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="calculation-grid-orb" cx=".3" cy=".2"><stop stop-color="#FFF"/><stop offset=".25" stop-color="#B8EDFF"/><stop offset=".6" stop-color="#53B9F2"/><stop offset="1" stop-color="#0B72CF"/></radialGradient>
    <filter id="calculation-grid-shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#477EAE" flood-opacity=".10"/></filter>
    <marker id="calculation-grid-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#65ACEE" stroke-width="1.3"/></marker>
    </defs><style>
    #calculation-grid {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    #calculation-grid .float {animation:calculation-grid-float 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #calculation-grid .float-alt {animation:calculation-grid-float 12s ease-in-out -4s infinite reverse;transform-box:fill-box;transform-origin:center}
    #calculation-grid .pulse {animation:calculation-grid-pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #calculation-grid .flow {stroke-dasharray:6 11;animation:calculation-grid-flow 3s linear infinite}
    #calculation-grid .spin {animation:calculation-grid-spin 22s linear infinite;transform-box:fill-box;transform-origin:center}
    #calculation-grid .scan {animation:calculation-grid-scan 7s ease-in-out infinite}
    #calculation-grid .bar {animation:calculation-grid-bar 6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
    #calculation-grid .draw {stroke-dasharray:2200;stroke-dashoffset:0;animation:calculation-grid-draw 12s ease-in-out infinite}
    @keyframes calculation-grid-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes calculation-grid-pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes calculation-grid-flow{to{stroke-dashoffset:-68}}
    @keyframes calculation-grid-spin{to{transform:rotate(360deg)}}
    @keyframes calculation-grid-scan{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(235px);opacity:.9}}
    @keyframes calculation-grid-bar{0%,100%{transform:scaleY(.92)}50%{transform:scaleY(1)}}
    @keyframes calculation-grid-draw{0%,100%{stroke-dashoffset:100}50%{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){#calculation-grid *,#calculation-grid *::before,#calculation-grid *::after{animation:none!important;transition:none!important}}
    </style><path d="M0 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M60 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M120 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M180 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M240 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M300 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M360 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M420 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M480 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M540 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M600 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M660 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M720 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M780 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M840 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M900 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M960 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M1020 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M1080 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M1140 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M1200 0V800" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 0H1200" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 60H1200" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 120H1200" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 180H1200" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 240H1200" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 300H1200" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 360H1200" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 420H1200" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 480H1200" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 540H1200" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 600H1200" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 660H1200" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 720H1200" stroke="#D8E8F5" stroke-opacity=".55"/><path d="M0 780H1200" stroke="#D8E8F5" stroke-opacity=".55"/></svg>