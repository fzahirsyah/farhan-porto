<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="node-field" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="node-field-title node-field-desc">
    <title id="node-field-title">Connected node field</title><desc id="node-field-desc">Connected node field</desc>
    <defs>
    <linearGradient id="node-field-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087BFF"/><stop offset="1" stop-color="#41D5E8"/></linearGradient>
    <linearGradient id="node-field-glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset="1" stop-color="#EDF6FF" stop-opacity=".92"/></linearGradient>
    <linearGradient id="node-field-silk" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#E9F7FF" stop-opacity=".12"/><stop offset=".4" stop-color="#A9DAFF" stop-opacity=".48"/><stop offset=".48" stop-color="#FFF"/><stop offset=".55" stop-color="#4EA6F4" stop-opacity=".65"/><stop offset=".72" stop-color="#D2F3FF" stop-opacity=".65"/><stop offset="1" stop-color="#F4FBFF" stop-opacity="0"/></linearGradient>
    <radialGradient id="node-field-halo"><stop stop-color="#BCE9FF" stop-opacity=".7"/><stop offset="1" stop-color="#DFF3FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="node-field-orb" cx=".3" cy=".2"><stop stop-color="#FFF"/><stop offset=".25" stop-color="#B8EDFF"/><stop offset=".6" stop-color="#53B9F2"/><stop offset="1" stop-color="#0B72CF"/></radialGradient>
    <filter id="node-field-shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#477EAE" flood-opacity=".10"/></filter>
    <marker id="node-field-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#65ACEE" stroke-width="1.3"/></marker>
    </defs><style>
    #node-field {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    #node-field .float {animation:node-field-float 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #node-field .float-alt {animation:node-field-float 12s ease-in-out -4s infinite reverse;transform-box:fill-box;transform-origin:center}
    #node-field .pulse {animation:node-field-pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    #node-field .flow {stroke-dasharray:6 11;animation:node-field-flow 3s linear infinite}
    #node-field .spin {animation:node-field-spin 22s linear infinite;transform-box:fill-box;transform-origin:center}
    #node-field .scan {animation:node-field-scan 7s ease-in-out infinite}
    #node-field .bar {animation:node-field-bar 6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
    #node-field .draw {stroke-dasharray:2200;stroke-dashoffset:0;animation:node-field-draw 12s ease-in-out infinite}
    @keyframes node-field-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes node-field-pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes node-field-flow{to{stroke-dashoffset:-68}}
    @keyframes node-field-spin{to{transform:rotate(360deg)}}
    @keyframes node-field-scan{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(235px);opacity:.9}}
    @keyframes node-field-bar{0%,100%{transform:scaleY(.92)}50%{transform:scaleY(1)}}
    @keyframes node-field-draw{0%,100%{stroke-dashoffset:100}50%{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){#node-field *,#node-field *::before,#node-field *::after{animation:none!important;transition:none!important}}
    </style><path d="M130 150L280 220" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><path d="M130 150L420 125" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><g data-part="node" class="pulse" style="animation-delay:-0.0s"><circle cx="130" cy="150" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="130" cy="150" r="3" fill="#4B9CDD"/></g><path d="M280 220L420 125" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><path d="M280 220L560 290" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><path d="M280 220L335 470" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><g data-part="node" class="pulse" style="animation-delay:-0.5s"><circle cx="280" cy="220" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="280" cy="220" r="3" fill="#4B9CDD"/></g><path d="M420 125L560 290" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><g data-part="node" class="pulse" style="animation-delay:-1.0s"><circle cx="420" cy="125" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="420" cy="125" r="3" fill="#4B9CDD"/></g><path d="M560 290L750 160" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><path d="M560 290L600 500" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><path d="M560 290L335 470" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><g data-part="node" class="pulse" style="animation-delay:-1.5s"><circle cx="560" cy="290" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="560" cy="290" r="3" fill="#4B9CDD"/></g><path d="M750 160L980 230" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><g data-part="node" class="pulse" style="animation-delay:-2.0s"><circle cx="750" cy="160" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="750" cy="160" r="3" fill="#4B9CDD"/></g><path d="M980 230L1130 115" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><path d="M980 230L1020 420" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><g data-part="node" class="pulse" style="animation-delay:-2.5s"><circle cx="980" cy="230" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="980" cy="230" r="3" fill="#4B9CDD"/></g><g data-part="node" class="pulse" style="animation-delay:-3.0s"><circle cx="1130" cy="115" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="1130" cy="115" r="3" fill="#4B9CDD"/></g><path d="M1020 420L815 520" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><path d="M1020 420L1050 680" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><g data-part="node" class="pulse" style="animation-delay:-3.5s"><circle cx="1020" cy="420" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="1020" cy="420" r="3" fill="#4B9CDD"/></g><path d="M815 520L600 500" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><path d="M815 520L1050 680" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><g data-part="node" class="pulse" style="animation-delay:-4.0s"><circle cx="815" cy="520" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="815" cy="520" r="3" fill="#4B9CDD"/></g><path d="M600 500L335 470" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><path d="M600 500L450 680" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><g data-part="node" class="pulse" style="animation-delay:-4.5s"><circle cx="600" cy="500" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="600" cy="500" r="3" fill="#4B9CDD"/></g><path d="M335 470L190 620" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><path d="M335 470L450 680" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><g data-part="node" class="pulse" style="animation-delay:-5.0s"><circle cx="335" cy="470" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="335" cy="470" r="3" fill="#4B9CDD"/></g><path d="M190 620L450 680" stroke="#B8D7EF" stroke-opacity=".5" stroke-width="1"/><g data-part="node" class="pulse" style="animation-delay:-5.5s"><circle cx="190" cy="620" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="190" cy="620" r="3" fill="#4B9CDD"/></g><g data-part="node" class="pulse" style="animation-delay:-6.0s"><circle cx="450" cy="680" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="450" cy="680" r="3" fill="#4B9CDD"/></g><g data-part="node" class="pulse" style="animation-delay:-6.5s"><circle cx="1050" cy="680" r="12" fill="#5FC5FC" opacity=".08"/><circle cx="1050" cy="680" r="3" fill="#4B9CDD"/></g></svg>