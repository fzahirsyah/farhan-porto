<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buku tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; color: #16212c; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    #summary { font-weight: 700; margin: 10px 0 18px; }
    .pass { color: #0f7a4a; } .fail { color: #b42318; }
    li { margin: 2px 0; } h2 { font-size: 15px; margin: 18px 0 4px; }
    pre { background: #fde8e6; padding: 6px 10px; white-space: pre-wrap; }
  </style>
<script defer src="../../portfolio-return-guard.js"></script></head>
<body>
  <h1>Accu-Z Accounting — test suite</h1>
  <p>Runs entirely in this page against in-memory databases. Your company files are never touched.</p>
  <div id="summary">Running…</div>
  <div id="out"></div>

  <script src="../js/vendor/sql-wasm.js"></script>
  <script src="../js/vendor/sql-wasm-binary.js"></script>
  <script src="../js/core/util.js"></script>
  <script src="../js/core/i18n.js"></script>
  <script src="../js/core/money.js"></script>
  <script src="../js/core/branding.js"></script>
  <script src="../js/db/db.js"></script>
  <script src="../js/db/schema.js"></script>
  <script src="../js/db/seed.js"></script>
  <script src="../js/core/fx.js"></script>
  <script src="../js/core/tax.js"></script>
  <script src="../js/core/numbering.js"></script>
  <script src="../js/core/posting.js"></script>
  <script src="../js/core/ledger.js"></script>
  <script src="../js/core/terbilang.js"></script>
  <script src="../js/core/documents.js"></script>
  <script src="../js/core/payments.js"></script>
  <script src="../js/core/subscriptions.js"></script>
  <script src="../js/core/banking.js"></script>
  <script src="../js/core/deals.js"></script>
  <script src="../js/core/taxops.js"></script>
  <script src="../js/core/reports2.js"></script>
  <script src="../js/core/templates.js"></script>
  <script>
    // demo.js needs Buku.store only for create(); populate() is pure, so load it after a stub.
    window.Buku.store = {};
  </script>
  <script src="../js/modules/demo.js"></script>
  <script>
  (async function () {
    const B = window.Buku;
    B.i18n.lang = 'en';
    const results = [];
    let group = 'General';
    const section = (name) => { group = name; };
    function ok(cond, name, detail) { results.push({ group, name, pass: !!cond, detail: cond ? '' : detail || '' }); }
    function eq(a, b, name) { ok(a === b, name, 'expected ' + JSON.stringify(b) + ', got ' + JSON.stringify(a)); }
    function throwsCode(fn, code, name) {
      try { fn(); ok(false, name, 'did not throw'); }
      catch (e) { ok(e.code === code || String(e.message).includes(code), name, 'threw ' + (e.code || e.message)); }
    }
    async function freshDb(opts) {
      const db = await B.dbm.create();
      B.schema.migrate(db);
      B.seed.initCompany(db, Object.assign({
        company: { name: 'Test Co', fiscal_year_start_month: 1 },
        addresses: [{ label: 'HQ', address: 'Jl. Test 1', is_default: true }],
        reps: [{ code: 'PU', name: 'Putri' }],
        coaTemplate: 'saas_property', currencies: ['IDR', 'USD', 'SGD'],
      }, opts || {}));
      return db;
    }
    const acc = (db, code) => db.scalar('SELECT id FROM accounts WHERE code=?', [code]);

    try {
      // ---------------- Money ----------------
      section('Money');
      const M = B.money;
      eq(M.parse('1.250.000', 0, 'id'), 1250000, 'parse IDR Indonesian grouping');
      eq(M.parse('1,250,000', 0, 'en'), 1250000, 'parse IDR English grouping');
      eq(M.parse('1.250,50', 2, 'id'), 125050, 'parse USD Indonesian decimals');
      eq(M.parse('1,250.50', 2, 'en'), 125050, 'parse USD English decimals');
      eq(M.parse('12.5', 2, 'id'), 1250, 'tolerate dot decimal in Indonesian mode');
      eq(M.parse('Rp 2.000.000', 0, 'id'), 2000000, 'strip currency text');
      eq(M.parse('(500)', 0, 'id'), -500, 'brackets mean negative');
      eq(M.parse('', 0), null, 'empty is null');
      eq(M.parse('0,005', 2, 'id'), 1, 'round half up on extra decimals');
      throwsCode(() => M.parse('12abc', 0), 'invalid_amount', 'reject garbage');
      eq(M.format(1250000, 0, { locale: 'id' }), '1.250.000', 'format IDR id');
      eq(M.format(125050, 2, { locale: 'en', code: 'USD' }), 'USD 1,250.50', 'format USD en with code');
      eq(M.format(-5, 2, { locale: 'id', parens: true }), '(0,05)', 'format negative in brackets');
      eq(M.format(0, 0, { dashZero: true }), '-', 'dash for zero');
      eq(M.rateToString('16.250,50'), '16250.5', 'rate with Indonesian separators');
      eq(M.rateToString('16,250.50'), '16250.5', 'rate with English separators');
      eq(M.rateToString('16.250'), '16250', 'rate with a single thousands dot');
      eq(M.rateToString('12600.5'), '12600.5', 'plain decimal rate');
      throwsCode(() => M.parseRate('0'), 'invalid_rate', 'zero rate rejected');
      eq(M.toBase(100, 2, '16250'), 16250, 'USD 1.00 at 16250');
      eq(M.toBase(33, 2, '16251.37'), 5363, 'USD 0.33 at 16251.37 rounds half up');
      eq(M.toBase(1000000000000, 2, '16250'), 162500000000000, 'large amounts stay exact');
      eq(M.percentOf(12000000, '2'), 240000, '2% of 12.000.000');
      eq(M.mulFrac(12000000, 11, 12), 11000000, '11/12 of 12.000.000');

      // ---------------- Tax ----------------
      section('Tax');
      const db0 = await freshDb();
      const ppn = db0.get("SELECT * FROM taxes WHERE code='PPN11'");
      eq(B.tax.dpp(12000000, ppn), 11000000, 'PPN DPP 11/12');
      eq(B.tax.amount(12000000, ppn), 1320000, 'PPN on 12.000.000 = 1.320.000 (matches INV-202610-0177)');
      eq(B.tax.effectiveRate(ppn), '11', 'effective PPN rate 11%');
      eq(B.tax.amount(12000000, db0.get("SELECT * FROM taxes WHERE code='PPH23C'")), 240000, 'PPh 23 2% = 240.000');
      eq(B.tax.amount(1000000, db0.get("SELECT * FROM taxes WHERE code='NONE'")), 0, 'no-tax is zero');

      // ---------------- Numbering ----------------
      section('Numbering');
      eq(B.numbering.render('INV-{YYYY}{MM}-{####}', 177, '2026-10-12'), 'INV-202610-0177', 'invoice pattern');
      eq(B.numbering.render('SO-{SALES}-{YY}{MM}-{###}', 29, '2026-10-08', { sales: 'PU' }), 'SO-PU-2610-029', 'sales code token');
      throwsCode(() => B.numbering.validatePattern('INV-{YYYY}'), 'invalid_pattern', 'pattern needs a counter');
      db0.run("UPDATE number_sequences SET next_number=177, reset='monthly', last_period='2026-10' WHERE doc_type='invoice'");
      eq(B.numbering.take(db0, 'invoice', '2026-10-20'), 'INV-202610-0177', 'continue from 177');
      eq(B.numbering.take(db0, 'invoice', '2026-10-21'), 'INV-202610-0178', 'increments');
      eq(B.numbering.take(db0, 'invoice', '2026-11-01'), 'INV-202611-0001', 'monthly reset');
      eq(B.numbering.take(db0, 'invoice', '2026-11-02', {}, (n) => n === 'INV-202611-0002'), 'INV-202611-0003', 'skips numbers already used');

      // ---------------- Schema & seed ----------------
      section('Schema & seed');
      eq(B.schema.currentVersion(db0), B.schema.LATEST, 'schema at latest version');
      eq(B.schema.migrate(db0).from, B.schema.LATEST, 'migrate is idempotent');
      ok(db0.scalar('SELECT count(*) FROM accounts') > 70, 'SaaS + property chart seeded');
      for (const st of ['cash', 'bank', 'ar', 'ap', 'tax_output', 'tax_input', 'deferred_revenue', 'customer_funds_held', 'opening_balance', 'retained_earnings', 'fx_realized', 'property_inventory']) {
        ok(db0.scalar('SELECT count(*) FROM accounts WHERE subtype=?', [st]) > 0, 'has ' + st + ' account');
      }
      eq(db0.scalar("SELECT count(*) FROM accounts WHERE currency='USD' AND subtype='ar'"), 1, 'USD receivable account is currency-locked');
      eq(db0.scalar('SELECT count(*) FROM accounts a WHERE a.parent_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM accounts p WHERE p.id=a.parent_id AND p.is_header=1)'), 0, 'every parent is a group account');
      const blank = await freshDb({ coaTemplate: 'blank' });
      ok(blank.scalar('SELECT count(*) FROM accounts') < db0.scalar('SELECT count(*) FROM accounts'), 'minimal chart is smaller');
      eq(db0.scalar('SELECT count(*) FROM company_addresses WHERE is_default=1'), 1, 'one default address');

      // ---------------- Posting engine ----------------
      section('Posting engine');
      const db = await freshDb();
      const bank = acc(db, '1-1200'), cap = acc(db, '3-1000'), rev = acc(db, '4-1000'), ar = acc(db, '1-1300'), arUsd = acc(db, '1-1310'), bankUsd = acc(db, '1-1210'), ppnOut = acc(db, '2-1600'), server = acc(db, '5-1000');
      const r1 = B.posting.post(db, { date: '2026-01-02', memo: 'Capital', lines: [{ account_id: bank, debit: 100000000 }, { account_id: cap, credit: 100000000 }] });
      eq(r1.number, 'JE-202601-0001', 'first entry numbered');
      throwsCode(() => B.posting.post(db, { date: '2026-01-02', lines: [{ account_id: bank, debit: 100 }, { account_id: cap, credit: 99 }] }), 'unbalanced', 'unbalanced entry rejected');
      throwsCode(() => B.posting.post(db, { date: '2026-01-02', lines: [{ account_id: acc(db, '1'), debit: 100 }, { account_id: cap, credit: 100 }] }), 'header_account', 'group account rejected');
      throwsCode(() => B.posting.post(db, { date: '2026-01-02', lines: [{ account_id: arUsd, debit: 100 }, { account_id: cap, credit: 100 }] }), 'currency_mismatch', 'IDR line on USD-locked account rejected');
      throwsCode(() => B.posting.post(db, { date: '2026-01-02', lines: [{ account_id: bank, debit: 100 }, { account_id: cap, debit: 100 }] }), 'one_sided', 'one-sided entry rejected');
      throwsCode(() => B.posting.post(db, { date: '2026-01-02', lines: [{ account_id: bank, debit: 100, credit: 100 }, { account_id: cap, credit: 0 }] }), 'both_sides', 'debit and credit on one line rejected');
      throwsCode(() => B.posting.post(db, { date: '2026-02-30', lines: [{ account_id: bank, debit: 1 }, { account_id: cap, credit: 1 }] }), 'invalid_date', 'invalid date rejected');
      throwsCode(() => B.posting.post(db, { date: '2026-01-02', currency: 'USD', lines: [{ account_id: bankUsd, debit: 1 }, { account_id: server, credit: 1 }] }), 'missing_rate', 'foreign entry needs a rate');
      db.run('UPDATE accounts SET is_active=0 WHERE id=?', [server]);
      throwsCode(() => B.posting.post(db, { date: '2026-01-02', lines: [{ account_id: server, debit: 1 }, { account_id: bank, credit: 1 }] }), 'inactive_account', 'inactive account rejected');
      db.run('UPDATE accounts SET is_active=1 WHERE id=?', [server]);
      eq(db.scalar('SELECT count(*) FROM journal_entries'), 1, 'failed posts leave nothing behind');

      // Invoice-like entry with PPN.
      const r2 = B.posting.post(db, { date: '2026-01-05', memo: 'Invoice', lines: [{ account_id: ar, debit: 13320000 }, { account_id: rev, credit: 12000000 }, { account_id: ppnOut, credit: 1320000 }] });
      ok(r2.id > 0, 'three-line entry posts');

      // Drafts may be unbalanced and are editable; posting validates.
      const draftId = B.posting.saveDraft(db, { date: '2026-01-06', memo: 'draft', lines: [{ account_id: bank, debit: 500 }] });
      eq(db.scalar('SELECT status FROM journal_entries WHERE id=?', [draftId]), 'draft', 'unbalanced draft saved');
      B.posting.saveDraft(db, { id: draftId, date: '2026-01-06', memo: 'draft 2', lines: [{ account_id: bank, debit: 500 }, { account_id: cap, credit: 500 }] });
      eq(db.scalar('SELECT count(*) FROM journal_lines WHERE entry_id=?', [draftId]), 2, 'draft updated in place');
      const posted = B.posting.postDraft(db, draftId);
      eq(posted.id, draftId, 'draft posted keeps its id');
      throwsCode(() => B.posting.deleteDraft(db, draftId), 'posted_entry_locked', 'posted entry cannot be deleted');

      // Immutability is enforced by SQLite itself, not only by the app.
      throwsCode(() => db.run('UPDATE journal_lines SET debit=1 WHERE entry_id=?', [r2.id]), 'posted_entry_locked', 'trigger blocks editing posted lines');
      throwsCode(() => db.run('DELETE FROM journal_lines WHERE entry_id=?', [r2.id]), 'posted_entry_locked', 'trigger blocks deleting posted lines');
      throwsCode(() => db.run('UPDATE journal_entries SET date=? WHERE id=?', ['2026-01-01', r2.id]), 'posted_entry_locked', 'trigger blocks changing posted date');
      throwsCode(() => db.run("UPDATE journal_entries SET status='draft' WHERE id=?", [r2.id]), 'posted_entry_locked', 'trigger blocks un-posting');

      // Reversal.
      const rv = B.posting.reverse(db, r2.id, '2026-01-07', 'Fix');
      const orig = B.posting.load(db, r2.id), mirror = B.posting.load(db, rv.id);
      eq(orig.reversed_by_id, rv.id, 'original links to reversal');
      ok(mirror.lines.every((l, i) => l.debit_base === orig.lines[i].credit_base && l.credit_base === orig.lines[i].debit_base), 'reversal mirrors every line');
      throwsCode(() => B.posting.reverse(db, r2.id, '2026-01-08'), 'already_reversed', 'cannot reverse twice');
      throwsCode(() => B.posting.reverse(db, rv.id, '2026-01-08'), 'is_reversal', 'cannot reverse a reversal');
      throwsCode(() => B.posting.reverse(db, r1.id, '2025-12-31'), 'reverse_before', 'reversal cannot predate original');

      // Foreign currency: single-currency rounding absorbed exactly.
      B.fx.set(db, 'USD', '2026-01-01', '16251.37');
      const lines = [{ account_id: server, debit: 33 }, { account_id: server, debit: 33 }, { account_id: server, debit: 33 }, { account_id: bankUsd, credit: 99 }];
      const rf = B.posting.post(db, { date: '2026-01-10', currency: 'USD', rate: '16251.37', lines });
      const sums = db.get('SELECT sum(debit_base) d, sum(credit_base) c FROM journal_lines WHERE entry_id=?', [rf.id]);
      eq(sums.d, sums.c, 'USD entry balances exactly in IDR after rounding');
      eq(sums.c, M.toBase(99, 2, '16251.37'), 'bank side keeps its exact conversion');

      // Mixed currencies must balance in IDR.
      const usdIdr = M.toBase(10000, 2, '16251.37');
      throwsCode(() => B.posting.post(db, { date: '2026-01-11', lines: [{ account_id: bankUsd, debit: 10000, currency: 'USD', rate: '16251.37' }, { account_id: bank, credit: usdIdr - 1 }] }), 'unbalanced', 'mixed entry off by 1 rupiah rejected');
      const rm = B.posting.post(db, { date: '2026-01-11', lines: [{ account_id: bankUsd, debit: 10000, currency: 'USD', rate: '16251.37' }, { account_id: bank, credit: usdIdr }] });
      ok(rm.id > 0, 'mixed IDR/USD transfer posts when balanced in IDR');

      // Opening balances: difference goes to Opening Balance Equity.
      const ob = B.posting.postOpening(db, '2025-12-31', [{ account_id: bank, debit: 5000000 }, { account_id: acc(db, '2-1100'), credit: 2000000 }, { account_id: bankUsd, debit: 10000, currency: 'USD', rate: '16000' }]);
      const obe = db.get("SELECT l.* FROM journal_lines l JOIN accounts a ON a.id=l.account_id WHERE l.entry_id=? AND a.subtype='opening_balance'", [ob.id]);
      eq(obe.credit_base, 5000000 - 2000000 + 1600000, 'opening difference credited to equity');
      ok(/^OB-2025-/.test(ob.number), 'opening entries use their own numbering');

      // Lock date.
      db.setting('lock_date', '2026-01-31');
      throwsCode(() => B.posting.post(db, { date: '2026-01-15', lines: [{ account_id: bank, debit: 1 }, { account_id: cap, credit: 1 }] }), 'period_locked', 'cannot post into a locked period');
      db.setting('lock_date', null);

      // ---------------- Reports ----------------
      section('Reports (demo data)');
      const d = await freshDb();
      B.demo.populate(d, '2026-10-13');
      const tb = B.ledger.trialBalance(d, '2026-10-13');
      ok(tb.balanced && tb.totalDebit > 0, 'trial balance balances');
      const bs = B.ledger.balanceSheet(d, ['2026-10-13', '2026-09-30', '2026-07-01']);
      ok(bs.difference.every((v) => v === 0), 'balance sheet balances on three dates');
      const pl = B.ledger.profitLoss(d, [{ from: '2026-01-01', to: '2026-10-13' }]);
      eq(pl.net[0], bs.currentProfit[0], 'P&L net profit equals current year profit on the balance sheet');
      eq(pl.net[0], B.ledger.netProfit(d, '2026-01-01', '2026-10-13'), 'net profit helper agrees');
      const blocks = pl.blocks.filter((b) => b.type === 'subtotal').map((b) => b.key);
      eq(blocks.join(','), 'gross_profit,operating_profit,profit_before_tax,net_profit', 'P&L subtotals in order');
      const monthly = B.ledger.profitLoss(d, [{ from: '2026-07-01', to: '2026-07-31' }, { from: '2026-08-01', to: '2026-08-31' }, { from: '2026-07-01', to: '2026-08-31' }]);
      eq(monthly.net[0] + monthly.net[1], monthly.net[2], 'monthly columns add up to the total');
      const bankId = acc(d, '1-1200');
      const gl = B.ledger.generalLedger(d, bankId, '2026-08-01', '2026-10-13');
      eq(gl.closing, B.ledger.accountBalances(d, '2026-10-13').get(bankId).base, 'ledger closing equals account balance');
      eq(gl.opening + gl.totalDebit - gl.totalCredit, gl.closing, 'ledger opening + movements = closing');
      const usdGl = B.ledger.generalLedger(d, acc(d, '1-1210'), null, '2026-10-13');
      eq(usdGl.closingForeign, 300000 - 4 * 45000, 'USD bank foreign balance tracked');
      const titip = B.ledger.accountBalances(d).get(acc(d, '2-1300')).base;
      eq(titip, 0, 'titipan cleared after remitting to developer');
      const hdr = B.ledger.generalLedger(d, acc(d, '1-1000'), null, '2026-10-13');
      ok(hdr.lines.length > 10, 'group account ledger shows its children');
      eq(B.reports2.controlChecks(d).length, 0, 'demo documents agree with the ledger');
      const issues = B.ledger.integrity(d).filter((i) => i.level === 'error');
      eq(issues.length, 0, 'integrity check finds no errors');
      const jr = B.ledger.journalReport(d, '2026-07-01', '2026-10-13');
      ok(jr.entries.length > 20 && jr.entries.every((e) => e.lines.length >= 2), 'journal report lists entries with lines');

      // ---------------- File round trip ----------------
      section('File round trip');
      const bytes = d.export();
      ok(bytes instanceof Uint8Array && bytes.length > 10000, 'export produces a SQLite file');
      eq(String.fromCharCode.apply(null, bytes.slice(0, 15)), 'SQLite format 3', 'file has the SQLite header');
      const d2 = await B.dbm.create(bytes);
      eq(B.schema.migrate(d2).from, B.schema.LATEST, 'reopened file needs no migration');
      eq(B.ledger.trialBalance(d2, '2026-10-13').totalDebit, tb.totalDebit, 'reopened file has identical totals');
      eq(d2.meta('file_id'), d.meta('file_id'), 'file identity preserved');
      throwsCode(() => d2.run('DELETE FROM journal_entries WHERE status=\'posted\''), 'posted_entry_locked', 'protections survive export (triggers are in the file)');
      ok(d2.scalar('PRAGMA foreign_keys') === 1, 'foreign keys on after reopen');
      d.export();
      ok(d.scalar('PRAGMA foreign_keys') === 1, 'foreign keys back on after export');


      // ================= TIER 2 =================
      section('Tier 2 · Documents & SaaS scenario');
      const t = await freshDb();
      const id2 = (code) => acc(t, code);
      const bal = (code, upto) => { const v = B.ledger.accountBalances(t, upto).get(id2(code)); return v ? v.base : 0; };
      const balF = (code) => B.ledger.accountBalances(t).get(id2(code)).foreign;
      const now2 = B.util.nowIso();
      const cust = t.insert('contacts', { name: 'PT. Tarumanagara Properti Indonesia', pic_name: 'Heri Arsiti', npwp: '32.152.956.1-297.000', tags: '["customer"]', payment_terms_days: 7, payment_term_text: 'Payment Before Delivery', created_at: now2, updated_at: now2 });
      const saas = t.scalar("SELECT id FROM products WHERE code='SAAS-BI'");
      const ppn11 = t.scalar("SELECT id FROM taxes WHERE code='PPN11'");
      const rep = t.scalar("SELECT id FROM sales_reps WHERE code='PU'");
      ok(saas > 0 && t.scalar('SELECT count(*) FROM doc_templates') >= 8, 'starter products and templates seeded');

      // Totals: 6 × 2.000.000 with VAT 11% effective.
      const c1 = B.docs.compute(t, {}, [{ quantity: 6000, unit_price: 2000000, tax_id: ppn11 }]);
      eq([c1.net, c1.tax_total, c1.total].join('/'), '12000000/1320000/13320000', 'SO totals match INV-202610-0177');
      const c2 = B.docs.compute(t, { discount_type: 'percent', discount_value: '10' }, [{ quantity: 1000, unit_price: 1000000, tax_id: ppn11 }, { quantity: 3000, unit_price: 333333, discount_percent: '5', tax_id: ppn11 }]);
      eq(c2.lines.reduce((x, l) => x + l.line_net, 0), c2.net, 'document discount spreads exactly over lines');
      eq(c2.lines.reduce((x, l) => x + l.line_tax, 0), c2.tax_total, 'line taxes add up to the document tax');

      const soId = B.docs.save(t, 'sales_order', { contact_id: cust, sales_rep_id: rep, date: '2026-10-08', currency: 'IDR', terms_days: 7, payment_term_text: 'Payment Before Delivery', validity_text: '1 Month', reference: 'MRPO-AP-202610-0016',
        note: '50 hits/month', lines: [{ product_id: saas, item_label: 'Tasya/Vero', description: 'BI checking + profiling', quantity: 6000, unit: 'Months', unit_price: 2000000, tax_id: ppn11, start_date: '2026-10-01', end_date: '2027-03-31', line_note: '6' }] });
      const soNo = B.docs.confirm(t, soId);
      ok(/^SO-202610-\d{4}$/.test(soNo), 'SO numbered on confirm (' + soNo + ')');
      eq(B.ledger.trialBalance(t, '2026-12-31').totalDebit, 0, 'a sales order does not touch the books');
      const invId = B.docs.invoiceFromSO(t, soId, { date: '2026-10-12' });
      const appr = B.docs.approve(t, invId);
      ok(/^INV-202610-\d{4}$/.test(appr.number), 'invoice numbered on approval (' + appr.number + ')');
      eq(t.scalar('SELECT status FROM documents WHERE id=?', [soId]), 'complete', 'SO fully invoiced');
      eq(bal('1-1300'), 13320000, 'receivable 13.320.000');
      eq(bal('2-1200'), 12000000, 'SaaS goes to Pendapatan Diterima di Muka (deferred)');
      eq(bal('2-1600'), 1320000, 'PPN Keluaran 1.320.000');
      eq(bal('4-1000'), 0, 'no SaaS revenue yet');
      const sub = t.get('SELECT * FROM subscriptions WHERE invoice_id=?', [invId]);
      ok(sub && sub.status === 'pending_payment' && sub.months === 6, 'subscription created, awaiting payment');

      // BCA statement shows 13.080.000 (PPh 23 withheld).
      const bca = 'Informasi Rekening - Mutasi Rekening\nNo. rekening : 2067711889\nNama : PT MILIKI RUMAH INDONESIA\nPeriode : 01/10/2026 - 31/10/2026\nKode Mata Uang : Rp\n\n' +
        'Tanggal Transaksi,Keterangan,Cabang,Jumlah,,Saldo\n' +
        "'15/10,TRSF E-BANKING CR 1510/FTSCY/WS95051 13080000.00 TARUMANAGARA PROP,'0000,\"13,080,000.00\",CR,\"13,080,000.00\"\n" +
        "'16/10,BIAYA ADM,'0000,\"25,000.00\",DB,\"13,055,000.00\"\n" +
        "'20/10,TRSF E-BANKING DB GOOGLE CLOUD,'0000,\"1,500,000.00\",DB,\"11,555,000.00\"\n" +
        'Saldo Awal,0.00\nMutasi Kredit,"13,080,000.00",1\nMutasi Debet,"1,525,000.00",2\nSaldo Akhir,"11,555,000.00"\n';
      const rows = B.banking.parseBCA(bca, 0);
      eq(rows.length, 3, 'BCA statement parsed (3 transactions, summary skipped)');
      eq(rows.map((r) => r.amount).join(','), '13080000,-25000,-1500000', 'BCA amounts with CR/DB signs');
      eq(rows[0].date, '2026-10-15', 'BCA date takes the year from the period line');
      const bankT = id2('1-1200');
      const imp = B.banking.importRows(t, bankT, rows, { preset: 'bca' });
      eq(imp.added, 3, 'statement lines imported');
      eq(B.banking.importRows(t, bankT, rows, { preset: 'bca' }).duplicates, 3, 're-importing the same file adds nothing');
      const l1 = t.get("SELECT * FROM bank_import_lines WHERE amount=13080000");
      const sug = B.banking.suggestions(t, l1.id)[0];
      ok(sug && sug.type === 'invoice' && sug.document_id === invId && sug.withholding === 240000, 'statement line matched to the invoice net of PPh 23');
      const pay = B.payments.post(t, { direction: 'in', contact_id: cust, date: '2026-10-15', account_id: bankT, amount: 13080000, bank_import_line_id: l1.id,
        allocations: [{ document_id: invId, amount: 13320000, withholding: 240000, bukti_potong_no: 'BP-0001' }] });
      ok(/^RCV-/.test(pay.number), 'payment numbered ' + pay.number);
      eq(t.scalar('SELECT status FROM documents WHERE id=?', [invId]), 'paid', 'invoice paid in full (cash + PPh 23)');
      eq(bal('1-1300'), 0, 'receivable cleared');
      eq(bal('1-1510'), 240000, 'PPh 23 Dibayar di Muka 240.000');
      eq(t.scalar('SELECT status FROM bank_import_lines WHERE id=?', [l1.id]), 'created', 'statement line marked as recorded');
      eq(t.scalar('SELECT status FROM subscriptions WHERE id=?', [sub.id]), 'pending_handover', 'subscription awaiting handover once paid');
      throwsCode(() => B.docs.unpost(t, invId, 'void'), 'has_payments', 'cannot void a paid invoice');

      // Handover and recognition.
      eq(B.subscriptions.handover(t, sub.id, '2026-11-01', 'BAST-01'), '2027-04-30', 'six months from 1 Nov ends 30 Apr');
      eq(t.scalar('SELECT count(*) FROM revenue_schedules WHERE subscription_id=?', [sub.id]), 6, 'six monthly schedule rows');
      eq(B.subscriptions.recognize(t, '2026-10').length, 0, 'nothing to recognize before the start month');
      eq(B.subscriptions.recognize(t, '2026-12').length, 2, 'Nov and Dec recognized');
      eq(B.subscriptions.recognize(t, '2026-12').length, 0, 'recognizing twice does nothing');
      eq(bal('4-1000'), 4000000, 'revenue 4.000.000 after two months');
      eq(bal('2-1200'), 8000000, 'deferred 8.000.000 left');
      B.subscriptions.recognize(t, '2027-04');
      eq(bal('4-1000'), 12000000, 'all 12.000.000 recognized by April');
      eq(bal('2-1200'), 0, 'deferred revenue fully released');
      const roll = B.reports2.deferredRollforward(t, '2026-10-01', '2027-04-30');
      eq([roll.opening, roll.invoiced, roll.recognized, roll.closing, roll.other].join('/'), '0/12000000/12000000/0/0', 'deferred revenue roll-forward');
      const mrr = B.subscriptions.mrr(t, '2027-01-15');
      eq(mrr.total, 2000000, 'MRR 2.000.000 in January');
      eq(B.subscriptions.displayStatus(t.get('SELECT * FROM subscriptions WHERE id=?', [sub.id]), '2027-04-10', 30), 'expiring', 'expiring inside the 30-day window');

      // Renewal with the same scheme.
      const renSo = B.subscriptions.renew(t, sub.id, { date: '2027-04-10' });
      const renDoc = B.docs.load(t, renSo);
      eq(renDoc.lines[0].start_date + '/' + renDoc.lines[0].end_date + '/' + renDoc.lines[0].quantity + '/' + renDoc.lines[0].unit_price, '2027-05-01/2027-10-31/6000/2000000', 'renewal SO: same plan, next period');
      throwsCode(() => B.subscriptions.renew(t, sub.id), 'renewal_exists', 'renewal is not created twice');
      B.docs.confirm(t, renSo);
      const renInv = B.docs.invoiceFromSO(t, renSo, { date: '2027-04-12' });
      B.docs.approve(t, renInv);
      const newSub = t.get('SELECT * FROM subscriptions WHERE invoice_id=?', [renInv]);
      eq(newSub.renews_id, sub.id, 'new subscription links to the one it renews');
      eq(t.scalar('SELECT renewed_by_id FROM subscriptions WHERE id=?', [sub.id]), newSub.id, 'old subscription marked renewed');

      section('Tier 2 · Credit notes, bills, expenses');
      const arBefore = bal('1-1300');
      const inv2 = B.docs.save(t, 'invoice', { contact_id: cust, date: '2026-11-03', currency: 'IDR', terms_days: 14, due_date: '2026-11-17', lines: [{ description: 'Konsultasi', quantity: 1000, unit_price: 5000000, tax_id: ppn11, account_id: id2('4-2300') }] });
      B.docs.approve(t, inv2);
      const cn = B.docs.creditNoteFromInvoice(t, inv2);
      const cnApp = B.docs.approve(t, cn);
      ok(/^CN-/.test(cnApp.number), 'credit note numbered');
      eq(t.scalar('SELECT status FROM documents WHERE id=?', [inv2]), 'paid', 'credit note settles the invoice');
      eq(bal('1-1300'), arBefore, 'receivable back where it was');
      eq(bal('4-2300'), 0, 'revenue reversed');
      // Bill with input VAT and PPh 23 withheld by us.
      const vend = t.insert('contacts', { name: 'CV Konsultan Pajak', tags: '["vendor"]', created_at: now2, updated_at: now2 });
      const pph23v = t.scalar("SELECT id FROM taxes WHERE code='PPH23V'");
      const ppnIn = t.scalar("SELECT id FROM taxes WHERE code='PPNIN11'");
      const bill = B.docs.save(t, 'bill', { contact_id: vend, date: '2026-11-05', currency: 'IDR', vendor_invoice_no: 'KP/11/001', withholding_tax_id: pph23v,
        lines: [{ description: 'Jasa konsultan pajak', quantity: 1000, unit_price: 10000000, tax_id: ppnIn, account_id: id2('6-4000') }] });
      B.docs.approve(t, bill);
      eq(bal('1-1500'), 1100000, 'PPN Masukan 1.100.000');
      eq(bal('2-1630'), 200000, 'Utang PPh 23 200.000 (we withheld 2%)');
      eq(bal('2-1100'), 10900000, 'payable is net of withholding: 10.900.000');
      const bl = t.get('SELECT * FROM documents WHERE id=?', [bill]);
      B.payments.post(t, { direction: 'out', contact_id: vend, date: '2026-11-20', account_id: bankT, amount: 10900000, fee: 6500, allocations: [{ document_id: bill, amount: B.docs.balance(bl) }] });
      eq(bal('2-1100'), 0, 'bill paid');
      eq(bal('7-5000') > 0, true, 'transfer fee expensed');
      const exp = B.docs.save(t, 'expense', { date: '2026-11-21', currency: 'IDR', paid_from_account_id: id2('1-1100'), subject: 'ATK', lines: [{ description: 'Kertas & tinta', quantity: 1000, unit_price: 450000, account_id: id2('6-5100') }] });
      B.docs.approve(t, exp);
      eq(t.scalar('SELECT status FROM documents WHERE id=?', [exp]), 'paid', 'expense is paid on approval');
      eq(bal('1-1100'), -450000, 'paid from cash');

      section('Tier 2 · Multi-currency & partial invoicing');
      B.fx.set(t, 'USD', '2026-10-01', '16000');
      const usdCust = t.insert('contacts', { name: 'Acme Pte Ltd', tags: '["customer"]', currency: 'USD', created_at: now2, updated_at: now2 });
      const usdSo = B.docs.save(t, 'sales_order', { contact_id: usdCust, date: '2026-10-01', currency: 'USD', rate: '16000', lines: [
        { description: 'Setup', quantity: 1000, unit_price: 400000, account_id: id2('4-2300') }, { description: 'Integration', quantity: 2000, unit_price: 300000, account_id: id2('4-2300') }] });
      B.docs.confirm(t, usdSo);
      const solines = t.all('SELECT id FROM document_lines WHERE document_id=? ORDER BY line_no', [usdSo]);
      const ui1 = B.docs.invoiceFromSO(t, usdSo, { date: '2026-10-02', qty: { [solines[0].id]: 1000, [solines[1].id]: 1000 } });
      B.docs.approve(t, ui1);
      eq(t.scalar('SELECT status FROM documents WHERE id=?', [usdSo]), 'partial', 'SO partially invoiced');
      throwsCode(() => B.docs.invoiceFromSO(t, usdSo, { qty: { [solines[1].id]: 2000 } }), 'over_invoice', 'cannot invoice more than ordered');
      B.fx.set(t, 'USD', '2026-10-10', '16100');
      const ui2 = B.docs.invoiceFromSO(t, usdSo, { date: '2026-10-10' });
      B.docs.approve(t, ui2);
      eq(t.scalar('SELECT status FROM documents WHERE id=?', [usdSo]), 'complete', 'SO fully invoiced after the second invoice');
      const usdBank = id2('1-1210');
      const i1 = t.get('SELECT * FROM documents WHERE id=?', [ui1]);
      B.payments.post(t, { direction: 'in', contact_id: usdCust, date: '2026-10-20', account_id: usdBank, amount: 700000, rate: '16300', fee: 2000, allocations: [{ document_id: ui1, amount: 702000 > i1.total ? i1.total : 702000 }] });
      eq(t.scalar('SELECT status FROM documents WHERE id=?', [ui1]), 'paid', 'USD invoice paid (bankT fee deducted)');
      ok(bal('7-2000') > 0, 'realized FX gain posted when paid at a higher rate');
      // Second invoice paid into the rupiah account.
      const i2 = t.get('SELECT * FROM documents WHERE id=?', [ui2]);
      B.payments.post(t, { direction: 'in', contact_id: usdCust, date: '2026-10-25', account_id: bankT, amount: B.money.toBase(i2.total, 2, '16050'), allocations: [{ document_id: ui2, amount: i2.total, doc_rate: '16050' }] });
      eq(bal('1-1310'), 0, 'USD receivable zero in IDR');
      eq(balF('1-1310'), 0, 'USD receivable zero in USD');

      section('Tier 2 · Banking & tax');
      // Transfer IDR → USD.
      B.fx.set(t, 'USD', '2026-11-01', '16200');
      const tr = B.banking.transfer(t, { date: '2026-11-02', from_id: bankT, to_id: usdBank, amount_from: 16300000, amount_to: 100000, rate_to: '16200' });
      ok(tr.id > 0, 'cross-currency transfer posted with FX difference');
      // Rules on remaining statement lines.
      B.banking.addRule(t, { pattern: 'BIAYA ADM', direction: 'out', account_id: id2('7-5000') });
      B.banking.addRule(t, { pattern: 'GOOGLE CLOUD', direction: 'out', account_id: id2('5-1000') });
      eq(B.banking.applyRules(t, bankT), 2, 'rules record the bank fee and the cloud bill');
      eq(t.scalar("SELECT count(*) FROM bank_import_lines WHERE status='new'"), 0, 'every statement line handled');
      // Reconcile October.
      const unc = B.banking.uncleared(t, bankT, '2026-10-31');
      const stmtLines = unc.filter((l) => l.import_line_id).map((l) => l.id);
      eq(stmtLines.length, 3, 'three cleared candidates from the statement');
      throwsCode(() => B.banking.reconcile(t, bankT, '2026-10-31', 11555001, stmtLines), 'rec_difference', 'wrong statement balance refused');
      ok(B.banking.reconcile(t, bankT, '2026-10-31', 11555000, stmtLines) > 0, 'October reconciled to the statement');
      eq(B.banking.clearedBalance(t, bankT), 11555000, 'cleared balance equals the statement');
      // PPN masa.
      const p10 = B.taxops.ppn(t, '2026-10');
      eq(p10.output, 1320000, 'PPN Keluaran Oct');
      const p11 = B.taxops.ppn(t, '2026-11');
      eq(p11.output - 0, 550000 - 550000 + 0, 'November invoice and credit note cancel out');
      eq(p11.input, 1100000, 'PPN Masukan Nov');
      B.taxops.closePPN(t, '2026-10');
      throwsCode(() => B.taxops.closePPN(t, '2026-10'), 'already_closed', 'a masa closes once');
      eq(bal('2-1610'), 1320000, 'Utang PPN for October');
      B.taxops.payTax(t, { account_id: id2('2-1610'), masa: '2026-10', date: '2026-11-15', amount: 1320000, bank_account_id: bankT, ntpn: '0123456789ABCDEF' });
      eq(bal('2-1610'), 0, 'PPN paid with NTPN');
      eq(B.taxops.withheldByCustomers(t, '2026-10-01', '2026-10-31')[0].bukti_potong_no, 'BP-0001', 'bukti potong register');

      section('Tier 2 · Reports & integrity');
      const ag = B.reports2.aging(t, 'ar', '2026-12-31');
      eq(ag.totals.baseTotal, bal('1-1300', '2026-12-31') + bal('1-1310', '2026-12-31') + bal('1-1320', '2026-12-31'), 'AR aging equals receivable accounts');
      const cf = B.reports2.cashFlow(t, '2026-10-01', '2027-04-30');
      eq(cf.difference, 0, 'cash flow statement reconciles to the change in cash');
      const errs2 = B.ledger.integrity(t).filter((i) => i.level !== 'info');
      eq(errs2.filter((i) => i.level === 'error').length, 0, 'no integrity errors');
      eq(B.reports2.controlChecks(t).length, 0, 'receivables, payables and deferred revenue agree with documents');
      eq(B.ledger.trialBalance(t, '2027-12-31').balanced, true, 'trial balance balances after all of Tier 2');

      section('Tier 2 · Void & reopen');
      const inv3 = B.docs.save(t, 'invoice', { contact_id: cust, date: '2026-12-01', currency: 'IDR', lines: [{ product_id: saas, quantity: 3000, unit: 'Months', unit_price: 2000000, tax_id: ppn11 }] });
      B.docs.approve(t, inv3);
      const p3 = B.payments.post(t, { direction: 'in', contact_id: cust, date: '2026-12-02', account_id: bankT, amount: 6540000, allocations: [{ document_id: inv3, amount: 6660000, withholding: 120000 }] });
      B.payments.voidPayment(t, p3.id, '2026-12-03');
      eq(t.scalar('SELECT status FROM documents WHERE id=?', [inv3]), 'open', 'voiding the payment reopens the invoice');
      B.docs.unpost(t, inv3, 'draft');
      eq(t.scalar('SELECT status FROM documents WHERE id=?', [inv3]), 'draft', 'invoice back to draft keeps its number');
      eq(t.scalar('SELECT count(*) FROM subscriptions WHERE invoice_id=?', [inv3]), 0, 'pending subscription removed');
      eq(B.reports2.controlChecks(t).length, 0, 'still consistent after void and reopen');

      section('Tier 2 · Templates & terbilang');
      eq(B.terbilang.words(13320000, 'IDR', 0, 'id'), 'Tiga belas juta tiga ratus dua puluh ribu rupiah', 'terbilang Indonesian');
      eq(B.terbilang.words(125050, 'USD', 2, 'en'), 'One thousand two hundred and fifty US dollars and fifty cents', 'amount in words English');
      eq(B.terbilang.words(1100000, 'IDR', 0, 'id'), 'Satu juta seratus ribu rupiah', 'seratus / seribu forms');
      const soHtml = B.templates.renderDocument(t, soId);
      ok(soHtml.includes('Opportunity Number') && soHtml.includes('MRPO-AP-202610-0016') && soHtml.includes('IDR 13.320.000') && soHtml.includes('VAT – 11%'), 'SO renders like the current sales order');
      ok(soHtml.includes('Klausul Hukum') && soHtml.includes('Agree &amp; Accepted by'), 'SO text blocks and signature');
      const invHtml = B.templates.renderDocument(t, invId);
      ok(invHtml.includes('Amount Due') && invHtml.includes('Invoice Number') && invHtml.includes('CENAIDJA') === false, 'invoice renders (no bankT details until set)');
      t.setting('bank_details', [{ account_name: 'PT Miliki Rumah Indonesia', bank: 'Bank BCA – Cabang Thamrin', account_no: '2067711889', swift: 'CENAIDJA', currency: 'IDR' }]);
      ok(B.templates.renderDocument(t, invId).includes('2067711889'), 'bankT details print on the invoice');
      ok(B.templates.renderPaymentReceipt(t, pay.id).includes('Tiga belas juta'), 'kwitansi with terbilang');
      ok(B.templates.renderContactStatement(t, cust, 'IDR', '2026-10-01', '2026-12-31').includes('INV-'), 'customer statement');
      ok(B.templates.markup('**a** *b* \\*c\n• x').includes('<strong>a</strong>') && B.templates.markup('<script>').includes('&lt;script'), 'text block markup is escaped');

      section('Tier 2 · Opening documents');
      const obeId = t.scalar("SELECT id FROM accounts WHERE subtype='opening_balance'");
      const arB = bal('1-1300');
      const oi = B.docs.save(t, 'invoice', { contact_id: cust, date: '2026-09-20', due_date: '2026-09-27', currency: 'IDR', reference: 'INV-202609-0150', lines: [{ description: 'Saldo awal INV-202609-0150', quantity: 1000, unit_price: 5550000, account_id: obeId }] });
      B.docs.approve(t, oi);
      eq(bal('1-1300') - arB, 5550000, 'opening invoice adds to receivables');
      eq(t.scalar('SELECT tax_total FROM documents WHERE id=?', [oi]), 0, 'opening invoice has no new PPN');
      B.payments.post(t, { direction: 'in', contact_id: cust, date: '2026-10-28', account_id: bankT, amount: 5550000, allocations: [{ document_id: oi, amount: 5550000 }] });
      eq(B.reports2.controlChecks(t).length, 0, 'opening invoice can be paid and keeps receivables consistent');

      section('Tier 2 · Upgrade from a Tier 1 file');
      const old = await B.dbm.create();
      old.tx(() => { old.exec(B.schema.MIGRATIONS[0].sql); old.meta('schema_version', 1); });
      B.seed.CURRENCIES.forEach(([code, name, sym, dec]) => old.insert('currencies', { code, name, symbol: sym, decimals: dec }));
      old.insert('company', { id: 1, name: 'PT Miliki Rumah Indonesia', created_at: now2, updated_at: now2 });
      old.insert('accounts', { code: '4-1000', name: 'Pendapatan SaaS', type: 'income', subtype: 'revenue', created_at: now2, updated_at: now2 });
      const up = B.schema.migrate(old);
      eq(up.from + '→' + up.to, '1→' + B.schema.LATEST, 'Tier 1 file upgrades');
      ok(old.scalar('SELECT count(*) FROM doc_templates') >= 8 && old.scalar("SELECT 1 FROM number_sequences WHERE doc_type='expense'"), 'upgrade adds templates and numbering');
      ok((old.setting('bank_details') || [])[0].account_no === '2067711889', 'MilikiRumah bank details pre-filled on upgrade');

      // ---------------- i18n ----------------
      section('Language');
      B.i18n.lang = 'id';
      eq(B.i18n.t('Balanced'), 'Seimbang', 'Indonesian translation');
      eq(B.i18n.t('Posted {number}', { number: 'JE-1' }), 'JE-1 diposting', 'placeholders filled');
      eq(B.i18n.formatDate('2026-10-13'), '13 Okt 2026', 'Indonesian short date');
      eq(B.i18n.err(new B.BukuError('unbalanced', 'x', { line: 2 })), 'Baris 3: Debit dan kredit belum seimbang.', 'error translated with line number');
      B.i18n.lang = 'en';
      eq(B.i18n.formatDate('2026-10-13', 'long'), '13 October 2026', 'English long date');
    } catch (e) {
      results.push({ group: 'CRASH', name: 'Test run crashed', pass: false, detail: (e && e.stack) || String(e) });
    }

    // ---------------- Render ----------------
    const failed = results.filter((r) => !r.pass);
    const groups = [...new Set(results.map((r) => r.group))];
    document.getElementById('summary').innerHTML = '<span class="' + (failed.length ? 'fail' : 'pass') + '">' + (results.length - failed.length) + ' / ' + results.length + ' passed</span>';
    document.getElementById('out').innerHTML = groups.map((g) => '<h2>' + g + '</h2><ul>' + results.filter((r) => r.group === g).map((r) =>
      '<li class="' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? '✓ ' : '✗ ') + r.name + (r.detail ? '<pre>' + String(r.detail).replace(/</g, '&lt;') + '</pre>' : '') + '</li>').join('') + '</ul>').join('');
    window.__results = { total: results.length, failed };
  })();
  </script>
</body>
</html>
